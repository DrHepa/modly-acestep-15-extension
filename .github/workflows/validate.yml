name: Validate extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q setup.py processor.py acestep_modly tests scripts
  cpu-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies without weights
        run: python scripts/ci_prepare.py
      - run: python -m acestep_modly.health --accelerator cpu
      - run: python -m unittest discover -s tests -v
        env:
          ACESTEP_TEST_UPSTREAM: '1'
